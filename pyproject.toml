[project]
name = "ha-cure-afvalbeheer"
version = "1.1.0"
description = "Home Assistant integration for Cure Afvalbeheer"
requires-python = ">=3.13"
dependencies = [
    "aiohttp",
    "beautifulsoup4>=4.13.0",
    "homeassistant",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mutmut",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    ".",
    "tests/_winstubs",
]

asyncio_mode = "auto"

# Mutatietests: `mutmut run`, daarna `mutmut results`. Alleen de parser,
# want daar zit de logica die de website moet lezen; de rest is
# Home Assistant-lijm die de gewone tests al afdekken.
[tool.mutmut]
paths_to_mutate = ["custom_components/cure_afvalbeheer/parsing/"]
tests_dir = ["tests/"]
also_copy = ["tests/", "custom_components/"]
