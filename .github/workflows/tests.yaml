name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"

      # pytest-homeassistant-custom-component brengt Home Assistant zelf mee.
      - name: Afhankelijkheden installeren
        run: pip install beautifulsoup4 pytest-homeassistant-custom-component ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (opmaak)
        run: ruff format --check .

      - name: Pytest
        run: pytest -q
